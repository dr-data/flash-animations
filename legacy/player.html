<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legacy Flash Simulation</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .player-shell {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 64px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }

    .player-header h1 {
      margin-bottom: 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }

    .player-frame {
      display: grid;
      place-items: center;
      min-height: 320px;
      padding: 18px;
      border: 1px solid #dfe4ee;
      border-radius: 18px;
      background: #111827;
      box-shadow: 0 18px 52px rgba(27, 39, 69, 0.08);
      overflow: auto;
    }

    .player-frame object,
    .player-frame embed,
    .player-frame ruffle-player,
    .player-frame ruffle-embed {
      max-width: 100%;
    }

    .player-meta {
      margin-top: 14px;
      color: #657184;
      font-size: 0.9rem;
      word-break: break-all;
    }

    .error {
      color: #ffffff;
      text-align: center;
      line-height: 1.6;
    }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <main class="player-shell">
    <div class="player-header">
      <div>
        <a class="back-link" href="./">All legacy simulations</a>
        <h1 id="title">Legacy simulation</h1>
      </div>
      <a class="back-link" href="../native/">Native ports</a>
    </div>

    <div id="player" class="player-frame" aria-live="polite"></div>
    <p id="meta" class="player-meta"></p>
  </main>

  <script>
    (() => {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const src = params.get("src");
      const title = params.get("title") || "Legacy simulation";
      const player = document.querySelector("#player");
      const meta = document.querySelector("#meta");

      document.title = title;
      document.querySelector("#title").textContent = title;

      if (!src || !src.startsWith("/flashdev2/") && !src.startsWith("/tt/")) {
        player.innerHTML = '<p class="error">Missing or invalid simulation path.</p>';
        return;
      }

      meta.textContent = src;

      const object = document.createElement("object");
      object.setAttribute("data", src);
      object.setAttribute("type", "application/x-shockwave-flash");
      object.setAttribute("width", "960");
      object.setAttribute("height", "600");
      object.textContent = "Loading simulation…";
      player.append(object);
    })();
  </script>
</body>
</html>
